{% set top_nav_ns = namespace(item_count=0) %}
        <nav class="terminal-menu">
            <ul vocab="https://schema.org/" typeof="BreadcrumbList">
                <li id="version-menu" hidden>
                    <label class="menu-item" for="version-select">version</label>
                    <select id="version-select"></select>
                </li>
                <li property="itemListElement" typeof="ListItem">
                    <a href="{{ config.repo_url }}" class="menu-item" property="item" typeof="WebPage">
                        <span property="name">GitHub</span>
                    </a>
                </li>
                {%- block search_button %}
                    {% with button_idx=top_nav_ns.item_count %}
                    {% include "partials/top-nav/search-button.html" %}
                    {% endwith %}
                {%- endblock search_button %}
            </ul>
        </nav>
<script>
// The versions mike published live one directory above this one, listed in a
// file it writes at the root of the branch. Absent when serving locally, in
// which case the menu stays hidden.
(function () {
    var root = new URL("{{ base_url }}/", window.location.href);
    var here = decodeURIComponent(window.location.pathname);
    var rest = here.slice(root.pathname.length);
    var current = root.pathname.replace(/^\/|\/$/g, "").split("/").pop();

    fetch(new URL("../versions.json", root).href).then(function (response) {
        if (!response.ok) throw new Error("no versions.json");
        return response.json();
    }).then(function (versions) {
        if (!versions.length) return;
        var select = document.getElementById("version-select");
        versions.forEach(function (version) {
            var names = [version.version].concat(version.aliases || []);
            var option = document.createElement("option");
            option.value = version.aliases && version.aliases.length
                ? version.aliases[0]
                : version.version;
            option.textContent = version.title || version.version;
            option.selected = names.indexOf(current) !== -1;
            select.appendChild(option);
        });
        // A directory the list does not mention, so name it rather than
        // leaving some other version showing as the current one.
        if (select.selectedIndex === -1) {
            var unlisted = document.createElement("option");
            unlisted.value = current;
            unlisted.textContent = current;
            unlisted.selected = true;
            select.insertBefore(unlisted, select.firstChild);
        }
        document.getElementById("version-menu").hidden = false;

        // Keep the reader on the same page where the chosen version has one.
        select.addEventListener("change", function () {
            var version = new URL("../" + select.value + "/", root);
            var same = new URL(rest, version);
            fetch(same.href, {method: "HEAD"}).then(function (response) {
                window.location.assign(response.ok ? same.href : version.href);
            }).catch(function () {
                window.location.assign(version.href);
            });
        });
    }).catch(function () {
        /* nothing published to switch between */
    });
})();
</script>
