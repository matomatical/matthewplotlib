site_name: matthewplotlib
site_description: A Python plotting library that aspires to not be painful.
copyright: Copyright © 2024–2026 Matthew Farrugia-Roberts, GPLv3.
# mike appends the version being deployed to this, so each version's pages
# give their own address as canonical.
site_url: https://matthewplotlib.far.in.net/
repo_url: https://github.com/matomatical/matthewplotlib
edit_uri: edit/main/docs/src/
strict: true

docs_dir: src
# keeps the built site out of the sources it was built from
site_dir: ../site

theme:
  name: terminal
  custom_dir: templates/theme
  palette: dark
  features:
    - navigation.side.indexes
    - revision.date
    - revision.history
extra_css:
  - css/sweetie16.css
  - css/pygments.css
  - css/override.css
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Examples: examples.md
  - API Reference:
    - matthewplotlib: api.md
    - plots: api/plots.md
    - animations: api/animations.md
    - data: api/data.md
    - colors: api/colors.md
    - colormaps: api/colormaps.md
    - core: api/core.md
    - terminal: api/terminal.md
    - window: api/window.md
    - camera: api/camera.md
    - unscii16: api/unscii16.md
  - Compatibility: compatibility.md
  - Changelog: changelog.md
  - Roadmap: roadmap.md

# Served by `mkdocs serve` for checking the site's own styling, and left out
# of anything published.
draft_docs: |
  styletest.md

watch:
  - ../README.md
  - ../CHANGELOG.md
  - ../examples/README.md
  - ../matthewplotlib
  - templates

plugins:
  - search
  - git-revision-date
  - mkdocstrings:
      custom_templates: templates/mkdocstrings
      default_handler: python
      handlers:
        python:
          paths: [".."]
          options:
            show_source: false
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_labels: true
            # the modules order their contents by hand, by topic
            members_order: source
            group_by_category: false
  - include-markdown
  - gh-admonitions

markdown_extensions:
  - footnotes
  - admonition
  - md_in_html
  - toc:
      permalink: "docs"
      toc_depth: "4"
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
      noclasses: false
  - pymdownx.inlinehilite
